<section class="hero topic-hero $slug" aria-labelledby="topic-title">
  <img class="hero-photo" src="assets/$slug.jpg" alt="">
  <div class="hero-shade"></div>
  <div class="hero-copy">
    <p class="eyebrow"><span class="dash"></span>News from $publisher</p>
    <h1 id="topic-title">$name</h1>
    <p class="intro">$topic_description</p>
  </div>
</section>
<section class="news-section" aria-labelledby="stories-title">
  <div class="section-heading">
    <h2 id="stories-title">Latest stories</h2>
    <span class="cadence">Last refreshed $updated</span>
  </div>
  <div class="stories-grid">$cards</div>
</section>
